name: Release

# v0.2.0 のようなタグを push すると Windows で exe を組み、GitHub Release に添付する。
# 手順は手元と同じ tools/build.py。タグとコード側のバージョンが食い違っていたら止める。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    name: build exe + publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev/build extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Tag must match core/version.py
        shell: bash
        run: |
          v=$(python -c "from core.version import __version__; print(__version__)")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != core.version v$v" >&2
            exit 1
          fi

      - name: Lint + tests
        run: |
          ruff check .
          ruff format --check .
          pytest tests/ -q

      - name: Build
        run: python tools/build.py

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          python - <<'PY' > release_notes.md
          import re
          from core.version import __version__
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(__version__)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          print(m.group(1).strip() if m else "（CHANGELOG に該当節なし）")
          PY
          cat release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: shot-monitor ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/shot-monitor.exe
            dist/shot-monitor-*-win64.zip
